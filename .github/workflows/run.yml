name: FCWXTH Poster

# GitHub's scheduler is best-effort and gets throttled to ~hourly, which is far
# too slow for warnings. Work around it: each run is ONE long job that polls
# every 60s for ~5.9 hours. Each job QUEUES ITS OWN SUCCESSOR the moment it
# starts (see "Queue the next window" below), so the next window begins the
# instant this one ends instead of waiting on the cron. The schedule is now
# only a backstop; pushing a code/config change to main restarts the loop
# immediately so changes go live without waiting.
#
# Why the self-relaunch exists: relying on the cron alone left real holes —
# the job ended and nothing restarted it for hours (2026-08-27 16:49-20:41,
# 3h54m dark; 2026-08-28 02:34-05:06, 2h32m dark). Nothing polled, so a
# warning issued in those windows would never have posted.
on:
  schedule:
    - cron: "*/30 * * * *"   # backstop only: recovers the loop if a job dies
                             # before it managed to queue its successor
  workflow_dispatch:
    inputs:
      test_alert:
        description: "Send a TEST phone alert (opens a test issue that @mentions you)"
        type: boolean
        default: false
      relaunch:
        # Set ONLY by a running job queueing its own successor. A relaunch must
        # QUEUE (never cancel the job that dispatched it) — see concurrency.
        # Deliberately a string, not a boolean: the `inputs` context in the
        # concurrency expression compares reliably against 'true' as a string.
        description: "Internal: queued by the previous window (leave as false)"
        type: string
        default: "false"
  push:
    branches: [main]
    paths:                    # state.json commits use [skip ci] and don't match
      - post.py
      - wx_card.py
      - acurite.py
      - feeds.yaml
      - requirements.txt
      - alert.py
      - .github/workflows/run.yml

permissions:
  contents: write
  issues: write               # alert.py opens the @mention alarm issue
  actions: write              # the job dispatches its own successor

concurrency:
  group: fcwxth-poster
  # Scheduled runs and self-relaunches QUEUE behind the current job instead of
  # cancelling it — a mid-flight kill between "posted to Facebook" and "pushed
  # state.json" would repost those items on the next run. Pushes and HUMAN
  # manual dispatches DO cancel (an intentional restart to pick up new code
  # right away). GitHub keeps at most one pending run per group, so a queued
  # successor and a queued cron restart collapse into one — no fan-out.
  cancel-in-progress: ${{ github.event_name != 'schedule' && inputs.relaunch != 'true' }}

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 358      # just under GitHub's 360-min job cap
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # A hung apt mirror once ate a whole 5.9h window (2026-08-19: this step sat
      # for an hour, the poll loop never started, so alert.py couldn't fire either).
      # The font is normally already on the runner, so cap it and carry on regardless.
      - name: Ensure DejaVu font for the conditions card
        timeout-minutes: 3
        continue-on-error: true
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-dejavu-core

      # Queue the successor NOW, not when the loop finishes: if this job dies
      # unexpectedly (runner loss, the 358-min timeout kill, a crashed step),
      # the end-of-job step below never runs — but a successor queued up front
      # is already waiting and starts within seconds. It sits pending for the
      # whole window because a relaunch never cancels an in-progress run.
      - name: Queue the next window
        id: relaunch
        if: github.ref == 'refs/heads/main'
        continue-on-error: true       # never block polling on a dispatch failure
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in 1 2 3; do
            if curl -fsS -m 20 -X POST \
                 -H "Authorization: Bearer $GH_TOKEN" \
                 -H "Accept: application/vnd.github+json" \
                 -H "X-GitHub-Api-Version: 2022-11-28" \
                 "https://api.github.com/repos/${{ github.repository }}/actions/workflows/run.yml/dispatches" \
                 -d '{"ref":"main","inputs":{"relaunch":"true"}}'; then
              echo "queued the next window"
              exit 0
            fi
            echo "::warning::relaunch dispatch attempt $attempt failed"
            sleep $((attempt * 5))
          done
          exit 1

      - name: Poll every 60 seconds
        env:
          FB_TOKEN_FCWXTH: ${{ secrets.FB_TOKEN_FCWXTH }}
          FB_TOKEN_PVFD:   ${{ secrets.FB_TOKEN_PVFD }}
          NASA_API_KEY:    ${{ secrets.NASA_API_KEY }}
          WU_API_KEY:      ${{ secrets.WU_API_KEY }}
          GH_TOKEN:        ${{ github.token }}
          # My AcuRite login for the station battery/signal check. OPTIONAL —
          # if these aren't set the health check is skipped and nothing else
          # changes. Account credentials, so they stay repo secrets like the rest.
          ACURITE_EMAIL:    ${{ secrets.ACURITE_EMAIL }}
          ACURITE_PASSWORD: ${{ secrets.ACURITE_PASSWORD }}
          # Dead-man's-switch ping URL (healthchecks.io or similar). OPTIONAL —
          # if the secret isn't set, the ping below is skipped and nothing changes.
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
        run: |
          git config user.name  "fcwxth-poster-bot"
          git config user.email "actions@users.noreply.github.com"
          # Sync to the branch tip FIRST. A queued job checks out the commit it
          # was queued at — after a long wait that snapshot (and its state.json)
          # can be hours stale, which re-posts old items AND guarantees a rebase
          # conflict on the first push (2026-07-12 incident).
          git pull --rebase -q origin main || true
          if [ "${{ inputs.test_alert }}" = "true" ]; then
            python alert.py --test || true
          fi
          had_failures=0
          last_ping=-240        # seed negative so the FIRST cycle of a window pings
          end=$((SECONDS + 21240))      # ~5.9 hours, then let the schedule restart
          while [ $SECONDS -lt $end ]; do
            # Self-heal: a corrupted state.json (e.g. conflict markers left by an
            # interrupted rebase) must never crash-loop the poller. Restore the
            # last committed copy and carry on.
            if ! python -c "import json; json.load(open('state.json'))" 2>/dev/null; then
              echo "::warning::state.json corrupted — restoring last committed copy"
              git rebase --abort >/dev/null 2>&1 || true
              git checkout HEAD -- state.json 2>/dev/null || true
            fi
            # Capture each cycle's output so a failure can quote its own error
            # lines in the alarm issue (output prints per-cycle instead of live).
            rc=0
            python post.py >/tmp/cycle.log 2>&1 || rc=$?
            cat /tmp/cycle.log
            if [ "$rc" -ne 0 ]; then
              echo "::warning::post.py reported failures this cycle (see log above)"
              if [ "$had_failures" = "0" ]; then
                # instant phone alarm on the FIRST failure of this job — an
                # @mention issue pushes to GitHub Mobile within ~a minute, and
                # the issue body now carries the failing cycle's error lines
                python alert.py --log /tmp/cycle.log || true
              fi
              had_failures=1
            fi
            # HEARTBEAT (dead-man's-switch). Our own alert.py can only fire from
            # INSIDE a running job — so when GitHub drops the runs entirely (the
            # 2026-08-06 runner outage: silent ~8.5h gap) nothing warns us. These
            # pings stop too, and the external monitor alarms on the silence.
            # Deliberately pings even on a failed cycle: this signals "the poller
            # is ALIVE", while post/alert failures are alert.py's job. Optional
            # (skipped if the secret is unset) and never breaks the loop.
            # THROTTLED to one ping per ~4 min (2026-08-31): healthchecks.io's
            # free plan stores only ~100 events, so a once-per-cycle ping burned
            # the whole event log in under 2h, leaving nothing to post-mortem a
            # morning alert with. 4 min stays inside the check's 5-minute period
            # (so it never shows "late") and stretches retention to ~7h. Detection
            # speed is unchanged - that is the 25-minute grace, not this. On a
            # failed ping last_ping is NOT advanced, so the next cycle retries.
            if [ -n "$HEALTHCHECK_URL" ] && [ $((SECONDS - last_ping)) -ge 240 ]; then
              if curl -fsS -m 10 --retry 3 -o /dev/null "$HEALTHCHECK_URL"; then
                last_ping=$SECONDS
              else
                echo "::warning::heartbeat ping failed (poller itself is fine)"
              fi
            fi
            if ! git diff --quiet -- state.json; then
              git add state.json
              git commit -m "update state [skip ci]" >/dev/null 2>&1 || true
              # -X theirs: if state.json conflicts, keep OUR (newest) values.
              # If the rebase still fails, ABORT it — never leave conflict
              # markers in state.json (they corrupt it and crash post.py).
              if ! git pull --rebase --autostash -X theirs -q origin main >/dev/null 2>&1; then
                git rebase --abort >/dev/null 2>&1 || true
                echo "::warning::git rebase conflict — kept local state, retrying next cycle"
              fi
              git push -q origin main >/dev/null 2>&1 || \
                echo "::warning::git push failed — state not saved to GitHub this cycle"
            fi
            sleep 60
          done
          # Fail the job at the end of the window so GitHub sends a failure
          # notification — otherwise an expired token could go unnoticed for weeks.
          if [ "$had_failures" = "1" ]; then
            echo "::error::One or more cycles had posting failures — check the warnings above and the FB tokens."
            exit 1
          fi

      # Last-ditch retry: only if the up-front dispatch never succeeded. Runs
      # even when the poll loop failed, because a failed window still has to
      # hand off to the next one. If this fails too, the cron backstop above is
      # what recovers the loop.
      - name: Queue the next window (retry)
        if: always() && github.ref == 'refs/heads/main' && steps.relaunch.outcome != 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsS -m 20 -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/run.yml/dispatches" \
            -d '{"ref":"main","inputs":{"relaunch":"true"}}' \
            || echo "::warning::could not queue the next window — the cron backstop will restart it"
